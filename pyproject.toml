[project]
name = "kiosktunes-mcp"
version = "0.1.0"
description = "Local TTY music control through MCP and mpv"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "ytmusicapi>=1.11,<2", "yt-dlp[default]>=2025.1"]
keywords = ["mcp", "model-context-protocol", "music", "youtube-music", "mpv", "cli", "tty"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Players",
]

[project.urls]
Homepage = "https://github.com/al4xdev/kiosktunes-mcp"
Repository = "https://github.com/al4xdev/kiosktunes-mcp"
Issues = "https://github.com/al4xdev/kiosktunes-mcp/issues"

[project.scripts]
kiosktunes-mcp = "kiosktunes_mcp.cli:main"
kiosktunes = "kiosktunes_mcp.cli:main"
simp-mcp = "kiosktunes_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiosktunes_mcp"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
